name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm ci
        working-directory: examples/hardhat-vault
      - run: npm run typecheck
      - run: npm run build
      - name: dist/ is up to date
        run: git diff --exit-code -- dist || (echo "Run npm run build and commit dist/" && exit 1)
      - name: Generated docs are up to date
        run: npm run gen && git diff --exit-code -- docs/rules.md schema.json
      - run: npm test
